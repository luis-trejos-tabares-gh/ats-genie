services:
  - type: web
    name: ats-assistant-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGIN
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "3145728"
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: SESSION_LIMIT
        value: "3"
      - key: SESSION_WINDOW_SECONDS
        value: "3600"
      - key: GLOBAL_MIN_INTERVAL
        value: "20"
      - key: GLOBAL_DAILY_LIMIT
        value: "30"
      - key: RATE_LIMIT_SALT
        sync: false
